name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # Respaldo; la fuente canónica es el VPS (trigger-pages-refresh.sh cada 30 min)
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # true: el deploy más reciente gana. Con false, un job waiting/queued
  # (p. ej. environment github-pages) bloqueaba todos los deploys siguientes
  # y Pages quedaba congelado durante horas.
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout command-center
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Resolver snapshot (VPS preferido)
        id: snapshot
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          if [ -f public/data/portfolio.json ] && [ -s public/data/portfolio.json ]; then
            echo "source=vps" >> "$GITHUB_OUTPUT"
            echo "Usando snapshot del VPS en el repo:"
            jq -r '"  portfolio: \(.generatedAt)"' public/data/portfolio.json
          else
            echo "source=ci" >> "$GITHUB_OUTPUT"
            echo "Sin snapshot VPS — se generará en CI (fallback)"
          fi

      - name: Generar snapshot en CI (fallback)
        if: steps.snapshot.outputs.source == 'ci'
        working-directory: dashboard
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm prepare:pages-data

      - name: Build sitio estático
        working-directory: dashboard
        env:
          VITE_BASE: /command-center/
          VITE_STATIC_PORTFOLIO: "1"
        run: |
          pnpm build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "Deploy portfolio.json generatedAt: $(jq -r .generatedAt dist/data/portfolio.json)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v4
