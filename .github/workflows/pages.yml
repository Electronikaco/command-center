name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
      - "config.sh.example"
  workflow_dispatch:
  schedule:
    # Respaldo; la fuente canónica es el VPS (trigger-pages-refresh.sh cada 30 min)
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # true: el deploy más reciente gana. Con false, un job waiting/queued
  # (p. ej. environment github-pages) bloqueaba todos los deploys siguientes
  # y Pages quedaba congelado durante horas.
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout command-center
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Resolver snapshots (VPS preferido)
        id: snapshots
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          if [ -f public/data/status.json ] && [ -s public/data/status.json ]; then
            echo "source=vps" >> "$GITHUB_OUTPUT"
            echo "Usando snapshots del VPS en el repo:"
            jq -r '"  status: \(.generatedAt) · \(.program.doneUcs)/\(.program.totalUcs) UCs · \(.orchestrator.estado)"' public/data/status.json
            jq -r '"  portfolio: \(.generatedAt)"' public/data/portfolio.json
          else
            echo "source=ci" >> "$GITHUB_OUTPUT"
            echo "Sin snapshots VPS — se generará en CI (fallback)"
          fi

      - name: Checkout dosmentes-front (solo fallback CI)
        if: steps.snapshots.outputs.source == 'ci'
        uses: actions/checkout@v4
        with:
          repository: electronikatm/dosmentes-front
          path: dosmentes-front
          token: ${{ secrets.GH_TOKEN }}

      - name: Instalar GitHub CLI (solo fallback CI)
        if: steps.snapshots.outputs.source == 'ci'
        run: sudo apt-get update && sudo apt-get install -y gh

      - name: Configurar orquestador para CI (solo fallback)
        if: steps.snapshots.outputs.source == 'ci'
        run: |
          cp config.sh.example config.sh
          sed -i "s|^ORCH_DIR=.*|ORCH_DIR=${{ github.workspace }}|" config.sh
          sed -i "s|^REPO_DIR=.*|REPO_DIR=${{ github.workspace }}/dosmentes-front|" config.sh
          printf '%s\n' \
            '**Estado:** idle' \
            '**Rama:** develop' \
            '**Tarea:** Snapshot GitHub Pages (CI fallback)' \
            '**Resumen:** Vista gerencial publicada automáticamente' \
            '**Bloqueos:** ninguno' \
            "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > status.md
          touch log.jsonl

      - name: Generar snapshots en CI (fallback)
        if: steps.snapshots.outputs.source == 'ci'
        working-directory: dashboard
        env:
          ORCH_DIR: ${{ github.workspace }}
          REPO_DIR: ${{ github.workspace }}/dosmentes-front
          PROJECTS_REGISTRY: ${{ github.workspace }}/dashboard/projects.registry.yaml
        run: pnpm prepare:pages-data

      - name: Build sitio estático
        working-directory: dashboard
        env:
          VITE_BASE: /command-center/
          VITE_STATIC_PORTFOLIO: "1"
        run: |
          pnpm build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "Deploy status.json generatedAt: $(jq -r .generatedAt dist/data/status.json)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v4
